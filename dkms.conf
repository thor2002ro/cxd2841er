PACKAGE_NAME="linux-dvb-drivers-fixes"
PACKAGE_VERSION="1.0.0"
AUTOINSTALL="yes"

# DKMS supplies the target kernel, which may differ from the running kernel.
# Single quotes survive DKMS's double-quoted directive reload.
MAKE[0]="make modules KERNELRELEASE='${kernelver}' KDIR='${kernel_source_dir:-/lib/modules/${kernelver}/build}'"

BUILT_MODULE_NAME=()
BUILT_MODULE_LOCATION=()
DEST_MODULE_LOCATION=()
for _cxd_module in cxd2841er r820t mn88472 mn88473 rtl2832 tda18250 \
    dvb-core dvb-usb dvb_usb_v2 dvb-usb-dib0700 dvb-usb-rtl28xxu; do
    # Match Kbuild's built-in core exception without leaving array-index gaps.
    if [[ "$_cxd_module" == dvb-core ]] && \
        grep -qsx 'CONFIG_DVB_CORE=y' "${kernel_source_dir:-/lib/modules/${kernelver}/build}/.config"; then
        continue
    fi
    BUILT_MODULE_NAME+=("$_cxd_module")
    BUILT_MODULE_LOCATION+=("upstream/linux")
    DEST_MODULE_LOCATION+=("/updates/dkms")
done
unset _cxd_module
